<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagements Lucie ISO 26000 — AfrSCM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --border: #ddd8ce;
    --text: #1a1915;
    --muted: #7a7568;
    --accent: #2e5e3e;
    --accent-light: #eaf2ec;
    --amber: #c87a1a;
    --amber-light: #fdf3e3;
    --red: #b53030;
    --red-light: #fdeaea;
    --modified: #fff8e6;
    --modified-border: #e6b84a;
    --cr-bg: #f0f4ff;
    --cr-border: #5a7ab8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  body.embed-mode header, body.embed-mode .toolbar,
  body.embed-mode main, body.embed-mode footer,
  body.embed-mode .breadcrumb { display: none !important; }
  body.embed-mode #change-summary { display: block !important; padding: 0; }

  .breadcrumb {
    font-family: monospace;
    font-size: 0.7rem;
    color: var(--muted);
    padding: 6px 2.5rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .breadcrumb a { color: var(--accent); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  header {
    background: var(--accent); color: white;
    padding: 1.2rem 2.5rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  }
  header .logo-zone h1 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
  header .logo-zone .sub { font-size: 0.72rem; font-weight: 300; opacity: 0.75; margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.08em; }
  header .reunion-badge { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }
  header .edit-indicator { background: var(--amber); color: white; border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  header .cr-indicator { background: var(--cr-border); color: white; border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  header .stats { margin-left: auto; display: flex; gap: 1.8rem; align-items: center; }
  .stat-pill { text-align: center; }
  .stat-pill .val { font-family: 'DM Serif Display', serif; font-size: 1.7rem; line-height: 1; }
  .stat-pill .lbl { font-size: 0.65rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }

  .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.7rem 2.5rem; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
  .filter-group { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
  .filter-group .group-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-right: 0.15rem; white-space: nowrap; }
  .filter-btn { border: 1.5px solid var(--border); background: transparent; border-radius: 20px; padding: 0.22rem 0.7rem; font-size: 0.73rem; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .filter-btn.modified-btn.active { background: var(--amber); border-color: var(--amber); color: white; }
  .filter-select { border: 1.5px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0.22rem 0.6rem; font-size: 0.73rem; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; outline: none; transition: border-color 0.15s; max-width: 220px; }
  .filter-select:hover, .filter-select:focus { border-color: var(--accent); }
  .view-toggle { margin-left: auto; display: flex; gap: 0.2rem; border: 1.5px solid var(--border); border-radius: 6px; overflow: hidden; }
  .view-btn { background: transparent; border: none; padding: 0.28rem 0.75rem; font-size: 0.73rem; font-family: 'DM Sans', sans-serif; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .view-btn.active { background: var(--accent); color: white; }

  main { padding: 1.5rem 2.5rem; max-width: 1600px; margin: 0 auto; }
  .main-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
  .main-layout .table-col { flex: 1; min-width: 0; }
  .main-layout .edit-col { width: 360px; flex-shrink: 0; position: sticky; top: 1rem; }

  .table-wrap { overflow-x: auto; }
  table.eng-table { width: 100%; border-collapse: collapse; font-size: 0.81rem; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  table.eng-table thead th { background: var(--bg); border-bottom: 2px solid var(--border); padding: 0.5rem 0.8rem; text-align: left; font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  table.eng-table thead th:hover { color: var(--accent); }
  table.eng-table thead th .sort-arrow { margin-left: 3px; opacity: 0.4; }
  table.eng-table thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.eng-table tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  table.eng-table tbody tr:last-child { border-bottom: none; }
  table.eng-table tbody tr:hover { background: var(--accent-light); }
  table.eng-table tbody tr.selected { background: #d4e8d8; }
  table.eng-table tbody tr.row-modified td { background: #fef3cd; }
  table.eng-table tbody tr.row-modified td:first-child { border-left: 4px solid var(--amber); }
  table.eng-table tbody tr.row-modified:hover td { background: #fde8a0; }
  table.eng-table tbody tr.row-modified.selected td { background: #fcd97a; }
  table.eng-table td { padding: 0.55rem 0.8rem; vertical-align: middle; }

  .pa-tag { font-weight: 600; font-size: 0.72rem; letter-spacing: 0.05em; color: white; padding: 0.15rem 0.5rem; border-radius: 4px; white-space: nowrap; display: inline-block; }
  .obj-text { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .dom-chip { font-size: 0.67rem; border-radius: 4px; padding: 0.12rem 0.45rem; white-space: nowrap; display: inline-block; color: white; }
  .badge-sm { font-size: 0.67rem; border-radius: 4px; padding: 0.12rem 0.45rem; font-weight: 500; white-space: nowrap; display: inline-block; }
  .badge-engage     { background: var(--accent-light); color: var(--accent); }
  .badge-non-engage { background: #f3f3f3; color: var(--muted); border: 1px solid var(--border); }
  .badge-priorite   { background: #fff0f0; color: var(--red); }
  .badge-referent   { background: var(--amber-light); color: var(--amber); }
  .badge-modified   { background: var(--modified); color: var(--amber); border: 1px solid var(--modified-border); font-size: 0.62rem; }

  .mini-bar-wrap { display: flex; align-items: center; gap: 5px; }
  .mini-bar-track { width: 55px; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .mini-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .mini-pct { font-size: 0.68rem; color: var(--muted); min-width: 26px; }

  .risk-badge { display: inline-block; font-size: 0.67rem; font-weight: 500; padding: 0.12rem 0.45rem; border-radius: 4px; }
  .risk-Faible { background: var(--accent-light); color: var(--accent); }
  .risk-Moyen  { background: var(--amber-light); color: var(--amber); }
  .risk-Eleve  { background: var(--red-light); color: var(--red); }

  .btn-edit-row { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 0.15rem 0.4rem; cursor: pointer; font-size: 0.75rem; color: var(--muted); transition: all 0.15s; line-height: 1; }
  .btn-edit-row:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  #detail-panel { margin-top: 1.1rem; display: none; animation: slideIn 0.18s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  .edit-panel { background: var(--surface); border: 2px solid var(--accent); border-radius: 10px; overflow: hidden; animation: slideIn 0.18s ease; }
  .edit-panel-header { background: var(--accent); color: white; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.6rem; }
  .edit-panel-header .pa-tag { background: rgba(255,255,255,0.25); font-size: 0.78rem; }
  .edit-panel-header .ep-title { font-size: 0.82rem; flex: 1; line-height: 1.4; }
  .edit-panel-header .btn-close-edit { background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 1rem; padding: 0; line-height: 1; }
  .edit-panel-header .btn-close-edit:hover { color: white; }
  .edit-panel-body { padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .edit-field label { display: block; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.3rem; }
  .toggle-engage { display: flex; gap: 0.4rem; }
  .toggle-btn { flex: 1; border: 1.5px solid var(--border); background: transparent; border-radius: 6px; padding: 0.35rem 0; font-size: 0.75rem; font-family: 'DM Sans', sans-serif; color: var(--muted); cursor: pointer; transition: all 0.15s; text-align: center; }
  .toggle-btn.on  { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .toggle-btn.off { background: #f3f3f3; border-color: var(--border); color: var(--muted); }
  .toggle-btn:disabled { opacity: 0.6; cursor: default; }
  .edit-select { width: 100%; border: 1.5px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0.35rem 0.6rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; }
  .edit-select:focus { border-color: var(--accent); }
  .edit-select:disabled { background: var(--bg); color: var(--muted); cursor: default; }

  .new-ref-wrap { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .new-ref-input { flex: 1; border: 1.5px solid var(--amber); background: var(--surface); border-radius: 6px; padding: 0.32rem 0.6rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; }
  .new-ref-input:focus { border-color: var(--accent); }
  .btn-new-ref-ok { background: var(--accent); border: none; color: white; border-radius: 6px; padding: 0.32rem 0.7rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
  .btn-new-ref-cancel { background: transparent; border: 1.5px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.32rem 0.6rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; cursor: pointer; }

  .slider-wrap { display: flex; align-items: center; gap: 0.6rem; }
  .slider-wrap input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-wrap input[type=range]:disabled { opacity: 0.6; cursor: default; }
  .slider-val { font-size: 0.8rem; font-weight: 600; color: var(--accent); min-width: 32px; text-align: right; }
  .edit-note { width: 100%; border: 1.5px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; color: var(--text); resize: vertical; min-height: 60px; outline: none; }
  .edit-note:focus { border-color: var(--accent); }
  .edit-note:disabled { background: var(--bg); color: var(--muted); cursor: default; resize: none; }
  .edit-field.field-modified { border-left: 3px solid var(--amber); padding-left: 0.6rem; background: var(--amber-light); border-radius: 0 4px 4px 0; }
  .btn-cancel-edit { background: transparent; border: 1.5px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.35rem 0.8rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .btn-cancel-edit:hover { border-color: var(--red); color: var(--red); }

  .diff-field { display: flex; flex-direction: column; gap: 0.25rem; }
  .diff-avant { font-size: 0.75rem; color: var(--muted); text-decoration: line-through; }
  .diff-apres { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
  .diff-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.2rem; }

  .detail-card { background: var(--surface); border: 2px solid var(--accent); border-radius: 10px; overflow: hidden; }
  .detail-card-header { display: flex; align-items: flex-start; gap: 0.9rem; padding: 0.9rem 1.2rem 0.6rem; border-bottom: 1px solid var(--border); }
  .detail-objectif { font-size: 0.9rem; line-height: 1.5; color: var(--text); flex: 1; }
  .detail-badges-row { display: flex; gap: 0.4rem; padding: 0.55rem 1.2rem; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
  .detail-avancement { padding: 0.5rem 1.2rem 0.4rem; border-bottom: 1px solid var(--border); }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--muted); margin-bottom: 0.25rem; }
  .bar-track { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s ease; }
  .detail-body { padding: 0.7rem 1.2rem 0.9rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .info-block label { display: block; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.2rem; }
  .info-block p { font-size: 0.78rem; line-height: 1.55; color: var(--text); }
  .info-block.full { grid-column: 1 / -1; }
  .indicateur-val { display: inline-block; background: var(--accent-light); color: var(--accent); border-radius: 4px; padding: 0.12rem 0.45rem; font-weight: 600; font-size: 0.72rem; margin-top: 0.25rem; }
  .detail-close-row { padding: 0.45rem 1.2rem 0.7rem; text-align: right; border-top: 1px solid var(--border); }
  .btn-close-detail { border: 1.5px solid var(--border); background: transparent; border-radius: 6px; padding: 0.28rem 0.8rem; font-size: 0.73rem; font-family: 'DM Sans', sans-serif; color: var(--muted); cursor: pointer; }
  .btn-close-detail:hover { border-color: var(--red); color: var(--red); }

  .domain-section { margin-bottom: 2rem; }
  .domain-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.85rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border); }
  .domain-badge { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .domain-title { font-family: 'DM Serif Display', serif; font-size: 1.05rem; font-weight: 400; }
  .domain-count { margin-left: auto; font-size: 0.68rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 0.1rem 0.5rem; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: box-shadow 0.2s; }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .card-header { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem 0.5rem; border-bottom: 1px solid var(--border); }
  .card-objectif { font-size: 0.84rem; line-height: 1.45; color: var(--text); flex: 1; }
  .badges-row { display: flex; gap: 0.35rem; padding: 0 1rem 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.35rem; }
  .avancement-bar { margin: 0 1rem 0.55rem; }
  .card-body { padding: 0 1rem 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }

  .empty-state { text-align: center; padding: 3rem 2rem; color: var(--muted); font-size: 0.88rem; }
  .loading-state { text-align: center; padding: 3rem 2rem; color: var(--muted); font-size: 0.88rem; font-style: italic; }
  footer { text-align: center; padding: 1.2rem; font-size: 0.68rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; }

  /* Indicateur serveur */
  #server-indicator { position: fixed; top: 12px; right: 18px; z-index: 60; display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: .65rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 3px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  #server-indicator .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  #server-indicator.ok  .dot { background: var(--accent); }
  #server-indicator.off .dot { background: var(--amber); }
  #server-indicator.err .dot { background: var(--red); }

  #change-summary { display: none; }
  #change-summary.visible { display: block; }
  .change-summary-inner { background: var(--surface); border: 1.5px solid var(--modified-border); border-radius: 8px; padding: 1rem 1.2rem; margin: 1rem 2.5rem; }
  .change-summary-inner h3 { font-family: 'DM Serif Display', serif; font-size: 1rem; font-weight: 400; margin-bottom: 0.7rem; color: var(--amber); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .change-summary-inner h3:hover { opacity: 0.85; }
  .cs-toggle { font-size: 0.72rem; font-family: 'DM Sans', sans-serif; color: var(--amber); border: 1px solid var(--modified-border); border-radius: 4px; padding: 0.1rem 0.45rem; transition: background 0.15s; }
  .change-summary-inner h3:hover .cs-toggle { background: var(--amber); color: white; }
  .cs-body { overflow: hidden; transition: max-height 0.25s ease, opacity 0.2s ease; }
  .cs-body.collapsed { max-height: 0 !important; opacity: 0; }
  .cs-row { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .cs-row:last-child { border-bottom: none; }
  .cs-pa { font-weight: 600; min-width: 42px; }
  .cs-field { color: var(--muted); min-width: 80px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 0.1rem; }
  .cs-avant { color: var(--muted); text-decoration: line-through; }
  .cs-apres { color: var(--accent); font-weight: 500; }
  .cs-arrow { color: var(--border); }
  .cs-note { color: var(--muted); font-style: italic; }

  @media (max-width: 900px) { .main-layout { flex-direction: column; } .main-layout .edit-col { width: 100%; position: static; } }
  @media (max-width: 700px) { header, main, .toolbar { padding-left: 1rem; padding-right: 1rem; } .cards-grid { grid-template-columns: 1fr; } .card-body, .detail-body { grid-template-columns: 1fr; } .view-toggle { margin-left: 0; } }
</style>
</head>
<body>

<div id="breadcrumb" class="breadcrumb"></div>

<header>
    <h1>Engagements Lucie ISO 26000</h1>
    <div class="sub">AfrSCM — Comite RSE - Renouvellement Label</div>
  </div>
  <div id="reunion-badge" style="display:none" class="reunion-badge"></div>
  <div id="edit-indicator" style="display:none" class="edit-indicator">Edition</div>
  <div id="cr-indicator" style="display:none" class="cr-indicator">CR</div>
  <div class="stats">
    <div class="stat-pill"><div class="val" id="stat-total">-</div><div class="lbl">Engagements</div></div>
    <div class="stat-pill"><div class="val" id="stat-engages">-</div><div class="lbl">Engages</div></div>
    <div class="stat-pill"><div class="val" id="stat-domaines">-</div><div class="lbl">Domaines</div></div>
  </div>
</header>

<div id="server-indicator" class="off">
  <span class="dot"></span>
  <span id="server-label">Serveur...</span>
</div>

<div id="change-summary">
  <div class="change-summary-inner" id="change-summary-inner"></div>
</div>

<div class="toolbar">
  <div class="filter-group">
    <span class="group-label">Statut :</span>
    <button class="filter-btn active" data-type="statut" data-val="all">Tous</button>
    <button class="filter-btn" data-type="statut" data-val="engage">Engages</button>
    <button class="filter-btn" data-type="statut" data-val="non-engage">Non engages</button>
    <button class="filter-btn" data-type="statut" data-val="priorite">Priorite 1</button>
    <button class="filter-btn modified-btn" data-type="statut" data-val="modified" id="btn-filter-modified" style="display:none">Modifies</button>
  </div>
  <div class="filter-group">
    <span class="group-label">Domaine :</span>
    <select id="select-domaine" class="filter-select"><option value="all">Tous les domaines</option></select>
  </div>
  <div class="filter-group" id="filter-referent-group">
    <span class="group-label">Referent :</span>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-view-table" onclick="setView('table')">Tableau</button>
    <button class="view-btn" id="btn-view-cards" onclick="setView('cards')">Cartes</button>
  </div>
</div>

<main>
  <div id="view-table">
    <div class="main-layout">
      <div class="table-col">
        <div class="table-wrap">
          <table class="eng-table">
            <thead>
              <tr>
                <th data-col="pa" onclick="sortBy('pa')">PA <span class="sort-arrow">&#8597;</span></th>
                <th data-col="domaine" onclick="sortBy('domaine')">Domaine <span class="sort-arrow">&#8597;</span></th>
                <th>Objectif</th>
                <th data-col="engage" onclick="sortBy('engage')">Statut <span class="sort-arrow">&#8597;</span></th>
