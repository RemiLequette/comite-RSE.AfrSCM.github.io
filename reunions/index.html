<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réunion — Comité RSE AfrSCM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root {
    --bg:#f5f3ee; --surface:#ffffff; --border:#d8d4cc; --border-strong:#a09890;
    --text:#1a1815; --text-muted:#7a746c; --accent:#2d5a8e; --accent-light:#e8eff7;
    --green:#2e7d52; --green-bg:#eaf4ee; --orange:#b85c00; --orange-bg:#fdf0e0;
    --blue:#1a5296; --blue-bg:#e8f0fb; --red:#8b1a1a;
    --amber:#c87a1a; --amber-light:#fff8e6; --amber-border:#e6b84a;
    --noted:#f0f7ff;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:var(--sans);color:var(--text);padding:28px;max-width:1200px;margin:0 auto;}

  /* ── Indicateur serveur ── */
  #server-indicator{position:fixed;top:12px;right:18px;z-index:60;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  #server-indicator .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  #server-indicator.ok  .dot{background:var(--green);}
  #server-indicator.off .dot{background:var(--amber);}
  #server-indicator.err .dot{background:var(--red);}

  /* ── Breadcrumb ── */
  #breadcrumb{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);margin-bottom:18px;}
  #breadcrumb a{color:var(--accent);text-decoration:none;}
  #breadcrumb a:hover{text-decoration:underline;}
  #breadcrumb span{color:var(--text-muted);}

  /* ── Header ── */
  header{border-bottom:2px solid var(--border-strong);padding-bottom:14px;margin-bottom:28px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header .header-main{flex:1;}
  header .meta{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  header h1{font-family:var(--mono);font-size:1.2rem;font-weight:600;color:var(--accent);}
  .edit-indicator{background:var(--amber);color:white;font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap;align-self:flex-start;margin-top:4px;}
  .prepare-indicator{background:var(--blue);color:white;font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap;align-self:flex-start;margin-top:4px;}

  /* ── Edit bar ── */
  .edit-bar{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:4px;padding:6px 14px;margin-bottom:16px;display:none;align-items:center;gap:12px;}
  .edit-bar .edit-info{font-family:var(--mono);font-size:.72rem;color:var(--amber);font-weight:600;flex:1;}
  .btn-edit-bar{border:1.5px solid var(--amber-border);background:white;border-radius:4px;padding:4px 12px;font-size:.72rem;font-family:var(--sans);color:var(--amber);cursor:pointer;font-weight:600;transition:all .15s;}
  .btn-edit-bar:hover{background:var(--amber);color:white;}

  /* ── Header réunion ── */
  .reunion-header{border-bottom:2px solid var(--border-strong);padding-bottom:14px;margin-bottom:24px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .reunion-header .header-main{flex:1;}
  .reunion-header .meta{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .reunion-header h2{font-family:var(--mono);font-size:1.2rem;font-weight:600;color:var(--accent);}
  .participants{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .presence-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:3px 8px 3px 6px;border-radius:3px;border:1.5px solid transparent;white-space:nowrap;}
  .presence-chip.present{background:var(--green-bg);color:var(--green);border-color:#b0d9bf;}
  .presence-chip.excuse{background:var(--amber-light);color:var(--amber);border-color:var(--amber-border);}
  .presence-chip.absent{background:#fdeaea;color:var(--red);border-color:#f0b8b8;}
  .presence-chip.clickable{cursor:pointer;transition:filter .15s;}
  .presence-chip.clickable:hover{filter:brightness(.93);}
  .presence-chip .pres-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .presence-chip.present .pres-dot{background:var(--green);}
  .presence-chip.excuse  .pres-dot{background:var(--amber);}
  .presence-chip.absent  .pres-dot{background:var(--red);}
  .statut-select{font-family:var(--mono);font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:2px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;outline:none;margin-left:10px;vertical-align:middle;}
  .statut-badge{display:inline-block;font-family:var(--mono);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:2px;margin-left:10px;vertical-align:middle;}
  .badge-terminee{background:var(--green-bg);color:var(--green);}
  .badge-encours{background:var(--orange-bg);color:var(--orange);}
  .badge-planifiee{background:var(--blue-bg);color:var(--blue);}

  /* ── Layout OdJ ── */
  .odj-layout{display:flex;gap:20px;align-items:flex-start;}
  .odj-col{flex:1;min-width:0;}
  .note-col{width:360px;flex-shrink:0;position:sticky;top:1rem;display:none;}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px;}
  .section-header{background:var(--text);color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;}
  .section-body{padding:14px;}

  /* ── Tableau OdJ ── */
  .odj-table{width:100%;border-collapse:collapse;font-size:.83rem;}
  .odj-table th{font-family:var(--mono);font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  .odj-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .odj-table tbody tr:last-child td{border-bottom:none;}
  .odj-table tbody tr{cursor:default;transition:background .1s;}
  .odj-table tbody tr.has-note td{background:var(--noted);}
  .odj-table tbody tr.has-note:hover td{background:#e0eeff;}
  .odj-table tbody tr.selected td{background:#dbeafe;}
  .odj-table tbody tr:not(.has-note):not(.selected):not(.reported):hover td{background:#f0f4fa;}
  .odj-table tbody tr.reported td{opacity:.55;}
  .odj-table td.num{font-family:var(--mono);font-size:.72rem;color:var(--text-muted);width:24px;}
  .odj-table td.duree{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);white-space:nowrap;width:54px;}
  .odj-table td.resp{font-family:var(--mono);font-size:.7rem;color:var(--accent);white-space:nowrap;width:52px;}
  .odj-table td.ressources{width:160px;}
  .odj-table td.note-col-cell{width:32px;text-align:center;}
  .odj-point-title{font-weight:600;color:var(--text);font-size:.85rem;}
  .reported .odj-point-title{color:var(--text-muted);}
  .odj-time{font-family:var(--mono);font-size:.62rem;color:var(--text-muted);font-weight:400;margin-left:7px;white-space:nowrap;vertical-align:middle;}
  .reported-badge{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:600;background:var(--border);color:var(--text-muted);padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:middle;}
  .odj-items{list-style:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);}
  .odj-items li{font-size:.71rem;color:#a09890;padding:2px 0 2px 10px;position:relative;line-height:1.4;}
  .odj-items li::before{content:'·';position:absolute;left:2px;color:var(--border);}
  .res-list{list-style:none;display:flex;flex-wrap:wrap;gap:3px;}
  .res-list li a{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:600;padding:2px 6px;border-radius:2px;text-decoration:none;white-space:nowrap;transition:opacity .1s;background:var(--blue-bg);color:var(--blue);}
  .res-list li a:hover{opacity:.75;}
  .res-list li a.res-support-precedent{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-border);}
  .res-sp-badge{display:inline-block;font-size:.55rem;font-weight:700;background:var(--amber);color:white;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle;letter-spacing:.04em;}
  .res-none{font-family:var(--mono);font-size:.62rem;color:var(--text-muted);font-style:italic;}
  .timer-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-family:var(--mono);font-size:.7rem;color:var(--text-muted);}
  .total-time{background:var(--orange-bg);color:var(--orange);font-weight:600;padding:2px 9px;border-radius:2px;}
  .btn-note-row{background:none;border:1px solid var(--border);border-radius:3px;padding:2px 5px;cursor:pointer;font-size:.72rem;color:var(--text-muted);transition:all .12s;line-height:1;}
  .btn-note-row:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .btn-note-row.has-note{border-color:var(--noted);color:var(--accent);background:var(--noted);font-weight:600;}

  /* ── Panneau notes ── */
  .note-panel{background:var(--surface);border:2px solid var(--accent);border-radius:6px;overflow:hidden;animation:slideIn .18s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .note-panel-header{background:var(--accent);color:white;padding:8px 12px;display:flex;align-items:center;gap:8px;}
  .note-panel-header .np-num{font-family:var(--mono);font-size:.7rem;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:2px;flex-shrink:0;}
  .note-panel-header .np-title{font-size:.8rem;flex:1;line-height:1.35;}
  .note-panel-header .btn-close-note{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:.95rem;padding:0;line-height:1;}
  .note-panel-header .btn-close-note:hover{color:white;}
  .note-panel-body{padding:10px 12px;max-height:calc(100vh - 200px);overflow-y:auto;}
  .np-section-label{font-family:var(--mono);font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:10px 0 5px;padding-top:10px;border-top:1px solid var(--border);}
  .np-section-label:first-child{border-top:none;margin-top:0;padding-top:0;}
  .note-textarea{width:100%;border:1px solid var(--border);border-radius:3px;padding:7px 9px;font-size:.82rem;font-family:var(--sans);color:var(--text);resize:vertical;min-height:80px;outline:none;background:#fdfcfa;line-height:1.6;}
  .note-textarea:focus{border-color:var(--accent);background:white;}
  .note-readonly{font-size:.82rem;line-height:1.6;color:var(--text);white-space:pre-wrap;padding:4px 0;}
  .note-readonly.empty{color:var(--text-muted);font-style:italic;}
  .np-list{list-style:none;margin-bottom:4px;}
  .np-list-item{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border);font-size:.78rem;}
  .np-list-item:last-child{border-bottom:none;}
  .npl-icon{font-size:.7rem;flex-shrink:0;color:var(--green);font-weight:700;}
  .npl-text{flex:1;line-height:1.4;}
  .npl-pill{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:1px 5px;border-radius:2px;flex-shrink:0;}
  .npl-ech{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);flex-shrink:0;}
  .btn-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;padding:1px 4px;border-radius:2px;transition:color .12s;}
  .btn-del:hover{color:var(--red);}
  .npl-edit{flex:1;border:1px solid var(--accent);border-radius:3px;padding:2px 5px;font-size:.76rem;font-family:var(--sans);outline:none;background:white;}
  .npl-edit-resp{border:1px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:.68rem;font-family:var(--mono);font-weight:600;outline:none;background:white;}
  .np-add-form{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .np-add-form input,.np-add-form select{border:1px solid var(--border);border-radius:3px;padding:4px 6px;font-size:.74rem;font-family:var(--sans);outline:none;background:#fdfcfa;}
  .np-add-form input:focus,.np-add-form select:focus{border-color:var(--accent);background:white;}
  .np-add-form .inp-desc{flex:1;min-width:100px;}
  .np-add-form .inp-ech{width:90px;}
  .btn-np-add{border:none;border-radius:3px;padding:4px 8px;font-size:.72rem;font-family:var(--sans);cursor:pointer;font-weight:600;white-space:nowrap;}
  .btn-np-add-dec{background:var(--green);color:white;}
  .btn-np-add-act{background:var(--accent);color:white;}
  .note-panel-footer{padding:6px 12px 10px;border-top:1px solid var(--border);text-align:right;}
  .btn-close-panel{border:1px solid var(--border);background:transparent;border-radius:3px;padding:4px 10px;font-size:.72rem;font-family:var(--sans);color:var(--text-muted);cursor:pointer;}
  .btn-close-panel:hover{border-color:var(--red);color:var(--red);}

  /* ── Récap ── */
  .bottom-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:0;}
  .recap-list{list-style:none;}
  .recap-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:flex-start;font-size:.82rem;}
  .recap-item:last-child{border-bottom:none;}
  .ri-icon{flex-shrink:0;font-size:.8rem;padding-top:1px;color:var(--green);font-weight:700;}
  .ri-body{flex:1;line-height:1.4;}
  .ri-point{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);margin-left:4px;background:var(--bg);border:1px solid var(--border);padding:1px 4px;border-radius:2px;white-space:nowrap;flex-shrink:0;align-self:center;}
  .ri-ech{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);flex-shrink:0;align-self:center;}
  .pill-remi{background:var(--blue-bg);color:var(--blue);}
  .pill-comite{background:var(--green-bg);color:var(--green);}
  .ri-edit{flex:1;border:1px solid var(--accent);border-radius:3px;padding:2px 5px;font-size:.78rem;font-family:var(--sans);outline:none;background:white;}
  .ri-edit-resp{border:1px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:.68rem;font-family:var(--mono);font-weight:600;outline:none;background:white;}
  .btn-recap-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;padding:1px 4px;flex-shrink:0;align-self:center;border-radius:2px;transition:color .12s;}
  .btn-recap-del:hover{color:var(--red);}
  .placeholder{font-size:.78rem;color:var(--text-muted);font-style:italic;padding:8px 0;}

  /* ── Engagements embed ── */
  #engagements-embed{display:none;margin-top:20px;}
  body.mode-cr #engagements-embed{display:block;}
  .engagements-embed-header{display:flex;align-items:center;gap:10px;background:var(--text);color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:4px 4px 0 0;}
  .engagements-embed-header span{flex:1;}
  .btn-refresh-embed{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);border-radius:3px;padding:2px 8px;font-size:.65rem;font-family:var(--mono);cursor:pointer;transition:all .12s;}
  .btn-refresh-embed:hover{background:rgba(255,255,255,.15);color:white;border-color:white;}
  #engagements-iframe{width:100%;border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;display:block;}

  /* ── Mode CR ── */
  .btn-mode-cr{position:fixed;bottom:18px;right:18px;z-index:50;border:1.5px solid var(--border-strong);background:var(--surface);border-radius:4px;padding:5px 13px;font-family:var(--mono);font-size:.68rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .btn-mode-cr:hover{border-color:var(--accent);color:var(--accent);}
  .btn-mode-cr.active{background:var(--accent);color:white;border-color:var(--accent);}
  body.mode-cr.panel-open .note-col{display:block !important;}
  body.mode-cr .odj-layout{display:block;}
  body.mode-cr.panel-open .odj-layout{display:flex;}
  .cr-note-block{display:none;margin-top:8px;padding:8px 10px;background:#fafaf8;border-left:3px solid var(--border-strong);border-radius:0 3px 3px 0;font-size:.78rem;line-height:1.6;color:var(--text);white-space:pre-wrap;}
  body.mode-cr .cr-note-block{display:block;}
  .cr-title{display:none;font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--text);text-align:center;padding:10px 0 14px;letter-spacing:.04em;border-bottom:1px solid var(--border);margin-bottom:18px;}
  body.mode-cr .cr-title{display:block;}

  /* ── Mode prépare ── */
  .presence-toggle{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .presence-btn{border:1.5px solid var(--border);background:transparent;border-radius:3px;padding:2px 8px;font-size:.68rem;font-family:var(--mono);font-weight:600;cursor:pointer;transition:all .12s;}
  .presence-btn.active-present{background:var(--green-bg);border-color:#b0d9bf;color:var(--green);}
  .presence-btn.active-excuse{background:var(--amber-light);border-color:var(--amber-border);color:var(--amber);}
  .odj-statut-select{font-family:var(--mono);font-size:.68rem;border:1px solid var(--border);border-radius:2px;padding:1px 5px;background:var(--surface);outline:none;cursor:pointer;}
  .odj-statut-select.reporte{background:var(--bg);color:var(--text-muted);}

  .empty-state{text-align:center;padding:3rem 2rem;color:var(--text-muted);font-size:.88rem;font-style:italic;}

  @media(max-width:700px){
    .bottom-layout{grid-template-columns:1fr;}
    .odj-layout{flex-direction:column;}
    .note-col{width:100%;position:static;}
  }
</style>
</head>
<body>

<div id="server-indicator" class="off">
  <span class="dot"></span>
  <span id="server-label">Serveur...</span>
</div>

<div id="breadcrumb"></div>

<div class="edit-bar" id="edit-bar">
  <div class="edit-info" id="edit-info">Modifications en cours</div>
  <button class="btn-edit-bar" onclick="clearChanges()">Effacer les modifications</button>
</div>

<div class="reunion-header">
  <div class="header-main">
    <div class="meta" id="r-meta">Comité RSE</div>
    <h2 id="r-titre">
      ---
      <span id="statut-display" class="statut-badge"></span>
      <select id="statut-select" class="statut-select" style="display:none" onchange="changeStatut(this.value)">
        <option value="En cours">En cours</option>
        <option value="Terminée">Terminée</option>
      </select>
    </h2>
    <div class="participants" id="participants-zone"></div>
  </div>
  <div id="mode-indicator" style="display:none"></div>
</div>

<div class="cr-title" id="cr-title"></div>

<div class="odj-layout">
  <div class="odj-col">
    <div class="section">
      <div class="section-header">Ordre du jour</div>
      <div class="section-body">
        <table class="odj-table">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>Point</th>
              <th class="duree">Durée</th>
              <th class="resp">Resp.</th>
              <th class="ressources">Ressources</th>
              <th class="note-col-cell" id="th-note"></th>
            </tr>
          </thead>
          <tbody id="odj-tbody"></tbody>
        </table>
        <div class="timer-bar" id="timer-bar"></div>
      </div>
    </div>
  </div>
  <div class="note-col" id="note-col">
    <div class="note-panel" id="note-panel"></div>
  </div>
</div>

<div class="bottom-layout">
  <div class="section">
    <div class="section-header">Décisions prises</div>
    <div class="section-body"><ul class="recap-list" id="dec-recap"></ul></div>
  </div>
  <div class="section">
    <div class="section-header">Actions</div>
    <div class="section-body"><ul class="recap-list" id="action-recap"></ul></div>
  </div>
</div>

<div id="engagements-embed">
  <div class="engagements-embed-header">
    <span>Engagements — modifications de la séance</span>
    <button class="btn-refresh-embed" onclick="refreshEmbed()">&#8635; Actualiser</button>
  </div>
  <iframe id="engagements-iframe" src="" frameborder="0" scrolling="no"></iframe>
</div>
