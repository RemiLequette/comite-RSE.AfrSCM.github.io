<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réunion — Comité RSE AfrSCM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root {
    --bg:#f5f3ee; --surface:#ffffff; --border:#d8d4cc; --border-strong:#a09890;
    --text:#1a1815; --text-muted:#7a746c; --accent:#2d5a8e; --accent-light:#e8eff7;
    --green:#2e7d52; --green-bg:#eaf4ee; --orange:#b85c00; --orange-bg:#fdf0e0;
    --blue:#1a5296; --blue-bg:#e8f0fb; --red:#8b1a1a;
    --amber:#c87a1a; --amber-light:#fff8e6; --amber-border:#e6b84a;
    --noted:#f0f7ff;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:var(--sans);color:var(--text);padding:28px;max-width:1200px;margin:0 auto;}

  /* ── Indicateur serveur ── */
  #server-indicator{position:fixed;top:12px;right:18px;z-index:60;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  #server-indicator .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  #server-indicator.ok  .dot{background:var(--green);}
  #server-indicator.off .dot{background:var(--amber);}
  #server-indicator.err .dot{background:var(--red);}

  /* ── Breadcrumb ── */
  #breadcrumb{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);margin-bottom:18px;}
  #breadcrumb a{color:var(--accent);text-decoration:none;}
  #breadcrumb a:hover{text-decoration:underline;}
  #breadcrumb span{color:var(--text-muted);}

  /* ── Header ── */
  header{border-bottom:2px solid var(--border-strong);padding-bottom:14px;margin-bottom:28px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header .header-main{flex:1;}
  header .meta{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  header h1{font-family:var(--mono);font-size:1.2rem;font-weight:600;color:var(--accent);}
  .edit-indicator{background:var(--amber);color:white;font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap;align-self:flex-start;margin-top:4px;}
  .prepare-indicator{background:var(--blue);color:white;font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap;align-self:flex-start;margin-top:4px;}

  /* ── Edit bar ── */
  .edit-bar{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:4px;padding:6px 14px;margin-bottom:16px;display:none;align-items:center;gap:12px;}
  .edit-bar .edit-info{font-family:var(--mono);font-size:.72rem;color:var(--amber);font-weight:600;flex:1;}
  .btn-edit-bar{border:1.5px solid var(--amber-border);background:white;border-radius:4px;padding:4px 12px;font-size:.72rem;font-family:var(--sans);color:var(--amber);cursor:pointer;font-weight:600;transition:all .15s;}
  .btn-edit-bar:hover{background:var(--amber);color:white;}

  /* ── Header réunion ── */
  .reunion-header{border-bottom:2px solid var(--border-strong);padding-bottom:14px;margin-bottom:24px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .reunion-header .header-main{flex:1;}
  .reunion-header .meta{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .reunion-header h2{font-family:var(--mono);font-size:1.2rem;font-weight:600;color:var(--accent);}
  .participants{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .presence-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:3px 8px 3px 6px;border-radius:3px;border:1.5px solid transparent;white-space:nowrap;}
  .presence-chip.present{background:var(--green-bg);color:var(--green);border-color:#b0d9bf;}
  .presence-chip.excuse{background:var(--amber-light);color:var(--amber);border-color:var(--amber-border);}
  .presence-chip.absent{background:#fdeaea;color:var(--red);border-color:#f0b8b8;}
  .presence-chip.clickable{cursor:pointer;transition:filter .15s;}
  .presence-chip.clickable:hover{filter:brightness(.93);}
  .presence-chip .pres-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .presence-chip.present .pres-dot{background:var(--green);}
  .presence-chip.excuse  .pres-dot{background:var(--amber);}
  .presence-chip.absent  .pres-dot{background:var(--red);}
  .statut-select{font-family:var(--mono);font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:2px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;outline:none;margin-left:10px;vertical-align:middle;}
  .statut-badge{display:inline-block;font-family:var(--mono);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:2px;margin-left:10px;vertical-align:middle;}
  .badge-terminee{background:var(--green-bg);color:var(--green);}
  .badge-encours{background:var(--orange-bg);color:var(--orange);}
  .badge-planifiee{background:var(--blue-bg);color:var(--blue);}

  /* ── Layout OdJ ── */
  .odj-layout{display:flex;gap:20px;align-items:flex-start;}
  .odj-col{flex:1;min-width:0;}
  .note-col{width:360px;flex-shrink:0;position:sticky;top:1rem;display:none;}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px;}
  .section-header{background:var(--text);color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;}
  .section-body{padding:14px;}

  /* ── Tableau OdJ ── */
  .odj-table{width:100%;border-collapse:collapse;font-size:.83rem;}
  .odj-table th{font-family:var(--mono);font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  .odj-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .odj-table tbody tr:last-child td{border-bottom:none;}
  .odj-table tbody tr{cursor:default;transition:background .1s;}
  .odj-table tbody tr.has-note td{background:var(--noted);}
  .odj-table tbody tr.has-note:hover td{background:#e0eeff;}
  .odj-table tbody tr.selected td{background:#dbeafe;}
  .odj-table tbody tr:not(.has-note):not(.selected):not(.reported):hover td{background:#f0f4fa;}
  .odj-table tbody tr.reported td{opacity:.55;}
  .odj-table td.num{font-family:var(--mono);font-size:.72rem;color:var(--text-muted);width:24px;}
  .odj-table td.duree{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);white-space:nowrap;width:54px;}
  .odj-table td.resp{font-family:var(--mono);font-size:.7rem;color:var(--accent);white-space:nowrap;width:52px;}
  .odj-table td.ressources{width:160px;}
  .odj-table td.note-col-cell{width:32px;text-align:center;}
  .odj-point-title{font-weight:600;color:var(--text);font-size:.85rem;}
  .reported .odj-point-title{color:var(--text-muted);}
  .odj-time{font-family:var(--mono);font-size:.62rem;color:var(--text-muted);font-weight:400;margin-left:7px;white-space:nowrap;vertical-align:middle;}
  .reported-badge{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:600;background:var(--border);color:var(--text-muted);padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:middle;}
  .odj-items{list-style:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);}
  .odj-items li{font-size:.71rem;color:#a09890;padding:2px 0 2px 10px;position:relative;line-height:1.4;}
  .odj-items li::before{content:'·';position:absolute;left:2px;color:var(--border);}
  .res-list{list-style:none;display:flex;flex-wrap:wrap;gap:3px;}
  .res-list li a{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:600;padding:2px 6px;border-radius:2px;text-decoration:none;white-space:nowrap;transition:opacity .1s;background:var(--blue-bg);color:var(--blue);}
  .res-list li a:hover{opacity:.75;}
  .res-list li a.res-support-precedent{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-border);}
  .res-sp-badge{display:inline-block;font-size:.55rem;font-weight:700;background:var(--amber);color:white;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle;letter-spacing:.04em;}
  .res-none{font-family:var(--mono);font-size:.62rem;color:var(--text-muted);font-style:italic;}
  .timer-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-family:var(--mono);font-size:.7rem;color:var(--text-muted);}
  .total-time{background:var(--orange-bg);color:var(--orange);font-weight:600;padding:2px 9px;border-radius:2px;}
  .btn-note-row{background:none;border:1px solid var(--border);border-radius:3px;padding:2px 5px;cursor:pointer;font-size:.72rem;color:var(--text-muted);transition:all .12s;line-height:1;}
  .btn-note-row:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .btn-note-row.has-note{border-color:var(--noted);color:var(--accent);background:var(--noted);font-weight:600;}

  /* ── Panneau notes ── */
  .note-panel{background:var(--surface);border:2px solid var(--accent);border-radius:6px;overflow:hidden;animation:slideIn .18s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .note-panel-header{background:var(--accent);color:white;padding:8px 12px;display:flex;align-items:center;gap:8px;}
  .note-panel-header .np-num{font-family:var(--mono);font-size:.7rem;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:2px;flex-shrink:0;}
  .note-panel-header .np-title{font-size:.8rem;flex:1;line-height:1.35;}
  .note-panel-header .btn-close-note{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:.95rem;padding:0;line-height:1;}
  .note-panel-header .btn-close-note:hover{color:white;}
  .note-panel-body{padding:10px 12px;max-height:calc(100vh - 200px);overflow-y:auto;}
  .np-section-label{font-family:var(--mono);font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:10px 0 5px;padding-top:10px;border-top:1px solid var(--border);}
  .np-section-label:first-child{border-top:none;margin-top:0;padding-top:0;}
  .note-textarea{width:100%;border:1px solid var(--border);border-radius:3px;padding:7px 9px;font-size:.82rem;font-family:var(--sans);color:var(--text);resize:vertical;min-height:80px;outline:none;background:#fdfcfa;line-height:1.6;}
  .note-textarea:focus{border-color:var(--accent);background:white;}
  .note-readonly{font-size:.82rem;line-height:1.6;color:var(--text);white-space:pre-wrap;padding:4px 0;}
  .note-readonly.empty{color:var(--text-muted);font-style:italic;}
  .np-list{list-style:none;margin-bottom:4px;}
  .np-list-item{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border);font-size:.78rem;}
  .np-list-item:last-child{border-bottom:none;}
  .npl-icon{font-size:.7rem;flex-shrink:0;color:var(--green);font-weight:700;}
  .npl-text{flex:1;line-height:1.4;}
  .npl-pill{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:1px 5px;border-radius:2px;flex-shrink:0;}
  .npl-ech{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);flex-shrink:0;}
  .btn-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;padding:1px 4px;border-radius:2px;transition:color .12s;}
  .btn-del:hover{color:var(--red);}
  .npl-edit{flex:1;border:1px solid var(--accent);border-radius:3px;padding:2px 5px;font-size:.76rem;font-family:var(--sans);outline:none;background:white;}
  .npl-edit-resp{border:1px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:.68rem;font-family:var(--mono);font-weight:600;outline:none;background:white;}
  .np-add-form{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .np-add-form input,.np-add-form select{border:1px solid var(--border);border-radius:3px;padding:4px 6px;font-size:.74rem;font-family:var(--sans);outline:none;background:#fdfcfa;}
  .np-add-form input:focus,.np-add-form select:focus{border-color:var(--accent);background:white;}
  .np-add-form .inp-desc{flex:1;min-width:100px;}
  .np-add-form .inp-ech{width:90px;}
  .btn-np-add{border:none;border-radius:3px;padding:4px 8px;font-size:.72rem;font-family:var(--sans);cursor:pointer;font-weight:600;white-space:nowrap;}
  .btn-np-add-dec{background:var(--green);color:white;}
  .btn-np-add-act{background:var(--accent);color:white;}
  .note-panel-footer{padding:6px 12px 10px;border-top:1px solid var(--border);text-align:right;}
  .btn-close-panel{border:1px solid var(--border);background:transparent;border-radius:3px;padding:4px 10px;font-size:.72rem;font-family:var(--sans);color:var(--text-muted);cursor:pointer;}
  .btn-close-panel:hover{border-color:var(--red);color:var(--red);}

  /* ── Récap ── */
  .bottom-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:0;}
  .recap-list{list-style:none;}
  .recap-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:flex-start;font-size:.82rem;}
  .recap-item:last-child{border-bottom:none;}
  .ri-icon{flex-shrink:0;font-size:.8rem;padding-top:1px;color:var(--green);font-weight:700;}
  .ri-body{flex:1;line-height:1.4;}
  .ri-point{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);margin-left:4px;background:var(--bg);border:1px solid var(--border);padding:1px 4px;border-radius:2px;white-space:nowrap;flex-shrink:0;align-self:center;}
  .ri-ech{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);flex-shrink:0;align-self:center;}
  .pill-remi{background:var(--blue-bg);color:var(--blue);}
  .pill-comite{background:var(--green-bg);color:var(--green);}
  .ri-edit{flex:1;border:1px solid var(--accent);border-radius:3px;padding:2px 5px;font-size:.78rem;font-family:var(--sans);outline:none;background:white;}
  .ri-edit-resp{border:1px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:.68rem;font-family:var(--mono);font-weight:600;outline:none;background:white;}
  .btn-recap-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;padding:1px 4px;flex-shrink:0;align-self:center;border-radius:2px;transition:color .12s;}
  .btn-recap-del:hover{color:var(--red);}
  .placeholder{font-size:.78rem;color:var(--text-muted);font-style:italic;padding:8px 0;}

  /* ── Engagements embed ── */
  #engagements-embed{display:none;margin-top:20px;}
  body.mode-cr #engagements-embed{display:block;}
  .engagements-embed-header{display:flex;align-items:center;gap:10px;background:var(--text);color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:4px 4px 0 0;}
  .engagements-embed-header span{flex:1;}
  .btn-refresh-embed{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);border-radius:3px;padding:2px 8px;font-size:.65rem;font-family:var(--mono);cursor:pointer;transition:all .12s;}
  .btn-refresh-embed:hover{background:rgba(255,255,255,.15);color:white;border-color:white;}
  #engagements-iframe{width:100%;border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;display:block;}

  /* ── Mode CR ── */
  .btn-mode-cr{position:fixed;bottom:18px;right:18px;z-index:50;border:1.5px solid var(--border-strong);background:var(--surface);border-radius:4px;padding:5px 13px;font-family:var(--mono);font-size:.68rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .btn-mode-cr:hover{border-color:var(--accent);color:var(--accent);}
  .btn-mode-cr.active{background:var(--accent);color:white;border-color:var(--accent);}
  body.mode-cr.panel-open .note-col{display:block !important;}
  body.mode-cr .odj-layout{display:block;}
  body.mode-cr.panel-open .odj-layout{display:flex;}
  .cr-note-block{display:none;margin-top:8px;padding:8px 10px;background:#fafaf8;border-left:3px solid var(--border-strong);border-radius:0 3px 3px 0;font-size:.78rem;line-height:1.6;color:var(--text);white-space:pre-wrap;}
  body.mode-cr .cr-note-block{display:block;}
  .cr-title{display:none;font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--text);text-align:center;padding:10px 0 14px;letter-spacing:.04em;border-bottom:1px solid var(--border);margin-bottom:18px;}
  body.mode-cr .cr-title{display:block;}

  /* ── Mode prépare ── */
  .presence-toggle{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .presence-btn{border:1.5px solid var(--border);background:transparent;border-radius:3px;padding:2px 8px;font-size:.68rem;font-family:var(--mono);font-weight:600;cursor:pointer;transition:all .12s;}
  .presence-btn.active-present{background:var(--green-bg);border-color:#b0d9bf;color:var(--green);}
  .presence-btn.active-excuse{background:var(--amber-light);border-color:var(--amber-border);color:var(--amber);}
  .odj-statut-select{font-family:var(--mono);font-size:.68rem;border:1px solid var(--border);border-radius:2px;padding:1px 5px;background:var(--surface);outline:none;cursor:pointer;}
  .odj-statut-select.reporte{background:var(--bg);color:var(--text-muted);}

  .empty-state{text-align:center;padding:3rem 2rem;color:var(--text-muted);font-size:.88rem;font-style:italic;}

  @media(max-width:700px){
    .bottom-layout{grid-template-columns:1fr;}
    .odj-layout{flex-direction:column;}
    .note-col{width:100%;position:static;}
  }
</style>
</head>
<body>

<div id="server-indicator" class="off">
  <span class="dot"></span>
  <span id="server-label">Serveur...</span>
</div>

<div id="breadcrumb"></div>

<div class="edit-bar" id="edit-bar">
  <div class="edit-info" id="edit-info">Modifications en cours</div>
  <button class="btn-edit-bar" onclick="clearChanges()">Effacer les modifications</button>
</div>

<div class="reunion-header">
  <div class="header-main">
    <div class="meta" id="r-meta">Comité RSE</div>
    <h2 id="r-titre">
      ---
      <span id="statut-display" class="statut-badge"></span>
      <select id="statut-select" class="statut-select" style="display:none" onchange="changeStatut(this.value)">
        <option value="En cours">En cours</option>
        <option value="Terminée">Terminée</option>
      </select>
    </h2>
    <div class="participants" id="participants-zone"></div>
  </div>
  <div id="mode-indicator" style="display:none"></div>
</div>

<div class="cr-title" id="cr-title"></div>

<div class="odj-layout">
  <div class="odj-col">
    <div class="section">
      <div class="section-header">Ordre du jour</div>
      <div class="section-body">
        <table class="odj-table">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>Point</th>
              <th class="duree">Durée</th>
              <th class="resp">Resp.</th>
              <th class="ressources">Ressources</th>
              <th class="note-col-cell" id="th-note"></th>
            </tr>
          </thead>
          <tbody id="odj-tbody"></tbody>
        </table>
        <div class="timer-bar" id="timer-bar"></div>
      </div>
    </div>
  </div>
  <div class="note-col" id="note-col">
    <div class="note-panel" id="note-panel"></div>
  </div>
</div>

<div class="bottom-layout">
  <div class="section">
    <div class="section-header">Décisions prises</div>
    <div class="section-body"><ul class="recap-list" id="dec-recap"></ul></div>
  </div>
  <div class="section">
    <div class="section-header">Actions</div>
    <div class="section-body"><ul class="recap-list" id="action-recap"></ul></div>
  </div>
</div>

<div id="engagements-embed">
  <div class="engagements-embed-header">
    <span>Engagements — modifications de la séance</span>
    <button class="btn-refresh-embed" onclick="refreshEmbed()">&#8635; Actualiser</button>
  </div>
  <iframe id="engagements-iframe" src="" frameborder="0" scrolling="no"></iframe>
</div>

function navTo(targetUrl){const bcRaw=new URLSearchParams(window.location.search).get('breadcrumb')||'';const pathRaw=new URLSearchParams(window.location.search).get('path')||'';const crumbs=bcRaw?bcRaw.split('|').map(p=>{const i=p.indexOf(':');return{nom:decodeURIComponent(p.slice(0,i)),lien:decodeURIComponent(p.slice(i+1))};}):[]; const pathCourant=pathRaw?pathRaw.split('/').filter(Boolean):[];const inverse=[];const segments=targetUrl.replace(/\?.*$/,'').split('/');segments.pop();for(const seg of segments){if(seg==='..'){inverse.unshift(pathCourant.pop()||'');}else if(seg){inverse.unshift('..');pathCourant.push(seg);}}const inv=inverse.filter(Boolean).join('/');const _bc_title=window._BC_TITLE||'Reunion';const newCrumbs=crumbs.map(c=>({nom:c.nom,lien:inv?inv+'/'+c.lien:c.lien}));const myFile=window.location.pathname.split('/').pop();newCrumbs.push({nom:_bc_title,lien:inv?inv+'/'+myFile:myFile});const bcStr=newCrumbs.map(c=>encodeURIComponent(c.nom)+':'+encodeURIComponent(c.lien)).join('|');const pathStr=pathCourant.join('/');const sep=targetUrl.includes('?')?'&':'?';return targetUrl+sep+'breadcrumb='+bcStr+'&path='+pathStr;}
function navRender(currentName) {
  window._BC_TITLE = currentName;

}

// ── Config ──
const SERVER_URL = 'http://localhost:3000';
const RESOURCE   = 'reunions';
const BASE = window.location.pathname.replace(/^\//, '').replace(/reunions\/[^/]*$/, '');

// ── Paramètres URL ──
const urlParams    = new URLSearchParams(window.location.search);
const URL_DATE     = urlParams.get('date') || null;
const URL_MODE     = urlParams.get('mode') || null;
const PREPARE_MODE = URL_DATE !== null && URL_MODE === 'prepare';
const EDIT_MODE    = URL_DATE !== null && URL_MODE === 'edit';

// ── État global ──
let DATA    = null;
let CHANGES = null;
let activeNoteId = null;
let crModeActive = false;
let _did = 100, _aid = 100;

const PRESENCE_LABELS = { present:'Présent', excuse:'Excusé', absent:'Absent' };
const PRESENCE_CYCLE  = ['present', 'excuse', 'absent'];

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- LOCAL-SERVER-START --- [github-pages stub]
var serverAvailable = false;
async function ping() { return false; }
async function saveChanges() {}
function setIndicator() {}
// Masquer l'indicateur serveur — sans objet sur GitHub Pages
document.addEventListener('DOMContentLoaded', function() {
  var el = document.getElementById('server-indicator');
  if (el) el.style.display = 'none';
});
// --- LOCAL-SERVER-END ---

// ── Chemins fichiers ──
function dataPath(date)    { return BASE + RESOURCE + '/historique/data-'    + date + '.json'; }
function changesPath(date) { return BASE + RESOURCE + '/historique/changes-' + date + '.json'; }

// ── Chargement JSON ──
async function fetchJson(absPath) {
  const r = await fetch(SERVER_URL + '/file?path=' + encodeURIComponent(absPath));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function saveJson(absPath, data) {
  if (!serverAvailable) return;
  try {
    const r = await fetch(SERVER_URL + '/file?path=' + encodeURIComponent(absPath), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data, null, 2)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setIndicator('ok', 'Serveur connecté');
  } catch(e) { setIndicator('err', 'Erreur sauvegarde'); }
}

// ── Formatage ──
function fmtMin(m) { return Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0'); }
function fmtDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}
function fmtDateLong(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function statutLabel(s) {
  if (s === 'Terminée') return 'Terminée';
  if (s === 'En cours') return 'En cours';
  return 'Préparation';
}
function statutBadgeClass(s) {
  if (s === 'Terminée') return 'badge-terminee';
  if (s === 'En cours') return 'badge-encours';
  return 'badge-planifiee';
}

// ── Chargement de la réunion ──
async function loadReunion(date) {
  let data, changes;

  if (!serverAvailable && REUNIONS_EMBEDDED) {
    const entry = REUNIONS_EMBEDDED.find(r => r.date === date);
    if (!entry) { showError('Réunion introuvable pour le ' + date); return; }
    data    = entry.data;
    changes = entry.changes || { statut: null, presences: [], notes: {}, decisions: [], actions: [] };
  } else if (serverAvailable) {
    data    = await fetchJson(dataPath(date));
    changes = await fetchJson(changesPath(date));
    if (!data) { showError('Fichier data introuvable pour le ' + date); return; }
    changes = changes || { statut: null, presences: [], notes: {}, decisions: [], actions: [] };
  } else {
    showError('Serveur non disponible — démarrez start-server.bat');
    return;
  }

  DATA    = data;
  CHANGES = changes;
  // Normaliser le statut — le JSON stocke 'Terminee' (sans accent),
  // le reste du code compare 'Terminée'. On normalise ici une seule fois.
  if (CHANGES.statut === 'Terminee') CHANGES.statut = 'Terminée';
  renderReunion(date);
}

function showError(msg) {
  document.getElementById('r-meta').textContent = '';
  document.getElementById('r-titre').childNodes[0].textContent = msg;
  document.getElementById('r-titre').childNodes[0].style.color = 'var(--red)';
}

// ── Rendu ──
function renderReunion(date) {
  const isEdit    = EDIT_MODE;
  const isPrepare = PREPARE_MODE;
  const isCR      = !isEdit && !isPrepare;

  // Titre de page et breadcrumb
  const shortDate = fmtDateShort(date);
  const reunionName = 'Réunion ' + shortDate;
  document.title = reunionName + ' — Comité RSE AfrSCM';
  navRender(reunionName);

  // CR title (mode CR)
  document.getElementById('cr-title').textContent =
    'Compte-rendu — Comité RSE AfrSCM — ' + shortDate;

  // Meta + h2
  const h = fmtMin(DATA.start_min || 0);
  document.getElementById('r-meta').textContent = 'Comité RSE · ' + (DATA.lieu || '') + ' · ' + h;
  document.getElementById('r-titre').childNodes[0].textContent = DATA.titre || ('Réunion du ' + shortDate);

  // Statut
  const statut = CHANGES.statut || 'Préparation';
  const sb = document.getElementById('statut-display');
  const ss = document.getElementById('statut-select');
  sb.textContent = statutLabel(statut);
  sb.className = 'statut-badge ' + statutBadgeClass(statut);
  if (isEdit) { sb.style.display='none'; ss.style.display=''; ss.value=CHANGES.statut||'En cours'; }
  else        { sb.style.display=''; ss.style.display='none'; }

  // Indicateur mode
  const mi = document.getElementById('mode-indicator');
  if (isEdit)    { mi.style.display=''; mi.className='edit-indicator';    mi.textContent='Édition'; }
  else if (isPrepare) { mi.style.display=''; mi.className='prepare-indicator'; mi.textContent='Préparation'; }
  else           { mi.style.display='none'; }

  // Edit bar
  const eb = document.getElementById('edit-bar');
  eb.style.display = (isEdit || isPrepare) ? 'flex' : 'none';
  if (isPrepare) document.getElementById('edit-info').textContent = 'Mode préparation — modifications OdJ';

  // th note
  document.getElementById('th-note').textContent = isEdit ? 'Notes' : '';

  // Bouton CR
  const btnCR = document.getElementById('btn-mode-cr');
  btnCR.classList.remove('active');
  if (isCR && CHANGES.statut === 'Terminée') {
    crModeActive = true;
    document.body.classList.add('mode-cr');
    btnCR.textContent = 'Mode normal';
    btnCR.classList.add('active');
    setTimeout(() => { injectCRNotes(); loadEngagementsEmbed(date); }, 0);
  } else {
    btnCR.textContent = 'Mode CR';
  }

  renderParticipants(isEdit, isPrepare);
  renderOdj(date, isEdit, isPrepare);
  renderRecap(isEdit);
  renderTimerBar();
}

// ── Participants ──
function getParticipantPresence(nom) {
  const found = (CHANGES.presences || []).find(p => p.nom === nom);
  return found ? found.presence_reelle : 'present';
}
function setParticipantPresence(nom, val) {
  if (!CHANGES.presences) CHANGES.presences = [];
  const found = CHANGES.presences.find(p => p.nom === nom);
  if (found) found.presence_reelle = val;
  else CHANGES.presences.push({ nom, presence_reelle: val });
}
function getPreparePresence(nom) {
  const found = (DATA.participants || []).find(p => p.nom === nom);
  return found ? (found.presence_prevue || 'present') : 'present';
}

function renderParticipants(isEdit, isPrepare) {
  const zone = document.getElementById('participants-zone');
  zone.innerHTML = (DATA.participants || []).map(p => {
    if (isPrepare) {
      const pv = getPreparePresence(p.nom);
      return '<span class="presence-chip ' + pv + '"><span class="pres-dot"></span>' + escHtml(p.nom)
        + ' <span class="presence-toggle" style="display:inline-flex;gap:2px;margin-left:4px;">'
        + ['present','excuse'].map(v => '<button class="presence-btn ' + (pv===v?'active-'+v:'') + '" data-nom="' + escHtml(p.nom) + '" data-val="' + v + '">' + (v==='present'?'P':'E') + '</button>').join('')
        + '</span></span>';
    }
    const s = getParticipantPresence(p.nom);
    const click = isEdit ? ' clickable' : '';
    return '<span class="presence-chip ' + s + click + '" data-nom="' + escHtml(p.nom) + '"><span class="pres-dot"></span>' + escHtml(p.nom) + ' · ' + PRESENCE_LABELS[s] + '</span>';
  }).join('');

  if (isEdit) {
    zone.querySelectorAll('.presence-chip.clickable').forEach(chip => {
      chip.addEventListener('click', () => {
        const nom = chip.dataset.nom;
        const cur = getParticipantPresence(nom);
        const next = PRESENCE_CYCLE[(PRESENCE_CYCLE.indexOf(cur)+1)%3];
        setParticipantPresence(nom, next);
        saveChanges();
        renderParticipants(true, false);
      });
    });
  }
  if (isPrepare) {
    zone.querySelectorAll('.presence-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = DATA.participants.find(x => x.nom === btn.dataset.nom);
        if (p) p.presence_prevue = btn.dataset.val;
        saveData();
        renderParticipants(false, true);
      });
    });
  }
}

// ── OdJ ──
function computeTimeSlots() {
  let c = DATA.start_min || 0;
  return (DATA.odj || []).map(p => {
    if (p.statut !== 'actif' || !p.duree_min) return { start: null, end: null };
    const s = c; c += p.duree_min; return { start: s, end: c };
  });
}

function pointHasContent(nid) {
  if ((CHANGES.notes||{})[nid] && CHANGES.notes[nid].trim()) return true;
  if ((CHANGES.decisions||[]).some(d => d.point_id===nid && d.texte.trim())) return true;
  if ((CHANGES.actions||[]).some(a => a.point_id===nid)) return true;
  return false;
}

function renderOdj(date, isEdit, isPrepare) {
  const slots = computeTimeSlots();
  const odj   = DATA.odj || [];
  const tbody = document.getElementById('odj-tbody');

  tbody.innerHTML = odj.map((p, i) => {
    const reported = p.statut !== 'actif';
    const hc  = !reported && pointHasContent(p.id);
    const sel = activeNoteId === p.id;
    const rc  = reported ? 'reported' : sel ? 'selected' : hc ? 'has-note' : '';
    const slot = slots[i];
    const tt = (slot && slot.start !== null) ? '<span class="odj-time">' + fmtMin(slot.start) + ' – ' + fmtMin(slot.end) + '</span>' : '';

    const titleHtml = reported
      ? '<span class="odj-point-title">' + escHtml(p.titre) + '<span class="reported-badge">' + escHtml(p.statut==='reporte'?'Reporté':'Hors sujet') + '</span></span>'
      : '<span class="odj-point-title">' + escHtml(p.titre) + '</span>' + tt;
    const itemsHtml = (p.items && p.items.length)
      ? '<ul class="odj-items">' + p.items.map(x => '<li>' + escHtml(x) + '</li>').join('') + '</ul>' : '';

    // Ressources — externe = nouvel onglet, interne = même onglet avec nav propagé
    const resHtml = (p.ressources && p.ressources.length)
      ? '<ul class="res-list">' + p.ressources.map(r => {
          const url = r.url.startsWith('http') ? r.url : '../' + r.url;
          if (r.support_precedent) {
            return '<li><a href="' + escHtml(url) + '" target="_blank" class="res-support-precedent" title="Support de la réunion précédente — à réviser ou remplacer">&#9888; ' + escHtml(r.label) + ' <span class="res-sp-badge">Révision à créer</span></a></li>';
          }
          if (r.url.startsWith('http')) {
            // Lien externe — nouvel onglet, pas de nav
            return '<li><a href="' + escHtml(url) + '" target="_blank">' + escHtml(r.label) + '</a></li>';
          }
          // Lien interne — même onglet avec nav propagé
          const navUrl = navTo(url);
          return '<li><a href="' + escHtml(navUrl) + '">' + escHtml(r.label) + '</a></li>';
        }).join('') + '</ul>'
      : '<span class="res-none">—</span>';

    let nc;
    if (reported)      nc = '<td class="note-col-cell"></td>';
    else if (isEdit)   nc = '<td class="note-col-cell"><button class="btn-note-row' + (hc?' has-note':'') + '" data-nid="' + p.id + '" title="Notes / Décisions / Actions">&#9998;</button></td>';
    else if (hc)       nc = '<td class="note-col-cell"><button class="btn-note-row has-note" data-nid="' + p.id + '" title="Voir les notes">&#128203;</button></td>';
    else               nc = '<td class="note-col-cell"></td>';

    const statutCell = isPrepare
      ? '<td><select class="odj-statut-select ' + (reported?'reporte':'') + '" data-pid="' + p.id + '">'
          + ['actif','reporte','hors_sujet'].map(v => '<option value="' + v + '"' + (p.statut===v?' selected':'') + '>' + v + '</option>').join('')
          + '</select></td>'
      : '';

    return '<tr class="' + rc + '" data-nid="' + p.id + '">'
      + '<td class="num">' + p.num + '</td>'
      + '<td>' + titleHtml + itemsHtml + '</td>'
      + '<td class="duree">' + escHtml(p.duree_min ? p.duree_min + ' min' : '—') + '</td>'
      + '<td class="resp">' + escHtml(p.resp || '') + '</td>'
      + '<td class="ressources">' + resHtml + '</td>'
      + nc + (isPrepare ? statutCell : '') + '</tr>';
  }).join('');

  tbody.querySelectorAll('.btn-note-row').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (crModeActive) {
        if (activeNoteId === b.dataset.nid) { closeNotePanel(); }
        else { activeNoteId = b.dataset.nid; document.body.classList.add('panel-open'); document.getElementById('note-col').style.display='block'; renderNotePanel(b.dataset.nid, false); }
      } else { openNotePanel(b.dataset.nid, isEdit); }
    });
  });
  if (!isEdit && !isPrepare && !crModeActive) {
    tbody.querySelectorAll('tr[data-nid]').forEach(tr => {
      tr.addEventListener('click', () => { if (pointHasContent(tr.dataset.nid)) openNotePanel(tr.dataset.nid, false); });
    });
  }
  if (isPrepare) {
    tbody.querySelectorAll('.odj-statut-select').forEach(sel => {
      sel.addEventListener('change', () => {
        const p = DATA.odj.find(x => x.id===sel.dataset.pid);
        if (p) { p.statut=sel.value; if(sel.value!=='actif'&&!p.statut_raison) p.statut_raison='Modifié en préparation'; if(sel.value==='actif') p.statut_raison=null; saveData(); renderOdj(URL_DATE||'',false,true); renderTimerBar(); }
      });
    });
  }
}

// ── Timer bar ──
function renderTimerBar() {
  const odj = DATA ? DATA.odj||[] : [];
  const totalMin = odj.reduce((a,p) => a + (p.statut==='actif' ? (p.duree_min||0) : 0), 0);
  const endMin   = (DATA ? DATA.start_min||0 : 0) + totalMin;
  document.getElementById('timer-bar').innerHTML =
    'Durée totale estimée : <span class="total-time">' + totalMin + ' min</span> · Fin prévue vers ' + fmtMin(endMin);
}

// ── Panneau notes ──
function openNotePanel(nid, isEdit) {
  if (activeNoteId===nid) { closeNotePanel(); return; }
  activeNoteId = nid;
  document.getElementById('note-col').style.display = '';
  renderNotePanel(nid, isEdit);
  renderOdj(URL_DATE||'', isEdit, false);
}

window.closeNotePanel = function() {
  activeNoteId = null;
  document.body.classList.remove('panel-open');
  document.getElementById('note-col').style.display = 'none';
  document.getElementById('note-panel').innerHTML = '';
  renderOdj(URL_DATE||'', EDIT_MODE, PREPARE_MODE);
};

function renderNotePanel(nid, isEdit) {
  const pt   = (DATA.odj||[]).find(p => p.id===nid);
  const note = (CHANGES.notes||{})[nid] || '';
  const decs = (CHANGES.decisions||[]).filter(d => d.point_id===nid);
  const acts = (CHANGES.actions||[]).filter(a => a.point_id===nid);
  const RESP = getResponsables();

  const nh = isEdit
    ? '<textarea class="note-textarea" id="note-ta-' + nid + '" placeholder="Notes libres..." oninput="changeNote(\'' + nid + '\',this.value)">' + escHtml(note) + '</textarea>'
    : (note.trim() ? '<div class="note-readonly">' + escHtml(note) + '</div>' : '<div class="note-readonly empty">Aucune note.</div>');

  const dh = decs.length ? '<ul class="np-list">' + decs.map(d => isEdit
    ? '<li class="np-list-item"><span class="npl-icon">&#10003;</span><input class="npl-edit" value="' + escHtml(d.texte) + '" oninput="editDec(\'' + d.id + '\',this.value)"><button class="btn-del" onclick="removeDec(\'' + d.id + '\')">&#128465;</button></li>'
    : '<li class="np-list-item"><span class="npl-icon">&#10003;</span><span class="npl-text">' + escHtml(d.texte) + '</span></li>'
  ).join('') + '</ul>' : '';

  const adh = isEdit ? '<div class="np-add-form"><input class="inp-desc" id="inp-dec-' + nid + '" type="text" placeholder="Nouvelle décision..."><button class="btn-np-add btn-np-add-dec" onclick="addDec(\'' + nid + '\')">+ Décision</button></div>' : '';

  const ah = acts.length ? '<ul class="np-list">' + acts.map(a => isEdit
    ? '<li class="np-list-item"><select class="npl-edit-resp" onchange="editActResp(\'' + a.id + '\',this.value)">' + RESP.map(r => '<option' + (r===a.resp?' selected':'') + '>' + escHtml(r) + '</option>').join('') + '</select><input class="npl-edit" value="' + escHtml(a.description) + '" oninput="editAct(\'' + a.id + '\',this.value)"><input class="npl-edit" style="width:80px" value="' + escHtml(a.echeance||'') + '" placeholder="AAAA-MM-JJ" oninput="editActEch(\'' + a.id + '\',this.value)"><button class="btn-del" onclick="removeAct(\'' + a.id + '\')">&#128465;</button></li>'
    : '<li class="np-list-item"><span class="npl-pill">' + escHtml(a.resp) + '</span><span class="npl-text">' + escHtml(a.description) + '</span><span class="npl-ech">' + escHtml(a.echeance||'') + '</span></li>'
  ).join('') + '</ul>' : '';

  const aah = isEdit ? '<div class="np-add-form"><select id="inp-act-resp-' + nid + '">' + RESP.map(r => '<option>' + escHtml(r) + '</option>').join('') + '</select><input class="inp-desc" id="inp-act-desc-' + nid + '" type="text" placeholder="Action..."><input class="inp-ech" id="inp-act-ech-' + nid + '" type="text" placeholder="AAAA-MM-JJ"><button class="btn-np-add btn-np-add-act" onclick="addAct(\'' + nid + '\')">+ Action</button></div>' : '';

  document.getElementById('note-panel').innerHTML =
    '<div class="note-panel-header"><span class="np-num">' + (pt?pt.num:'') + '</span><span class="np-title">' + escHtml(pt?pt.titre:nid) + '</span><button class="btn-close-note" onclick="closeNotePanel()">&#10005;</button></div>'
    + '<div class="note-panel-body"><div class="np-section-label">Notes</div>' + nh
    + '<div class="np-section-label">Décisions</div>' + dh + adh
    + '<div class="np-section-label">Actions</div>' + ah + aah + '</div>'
    + '<div class="note-panel-footer"><button class="btn-close-panel" onclick="closeNotePanel()">Fermer</button></div>';

  const ta = document.getElementById('note-ta-' + nid);
  if (ta) ta.focus();
}

function getResponsables() { return (DATA.participants||[]).map(p => p.nom).concat(['Comité']); }

// ── Récap ──
function renderRecap(isEdit) {
  const decs = (CHANGES.decisions||[]).filter(d => d.texte && d.texte.trim());
  document.getElementById('dec-recap').innerHTML = decs.length ? decs.map(d => {
    const pt = (DATA.odj||[]).find(p => p.id===d.point_id);
    return isEdit
      ? '<li class="recap-item"><span class="ri-icon">&#10003;</span><input class="ri-edit" value="' + escHtml(d.texte) + '" oninput="editDec(\'' + d.id + '\',this.value)">' + (pt?'<span class="ri-point">#'+pt.num+'</span>':'') + '<button class="btn-recap-del" onclick="removeDec(\'' + d.id + '\')">&#128465;</button></li>'
      : '<li class="recap-item"><span class="ri-icon">&#10003;</span><span class="ri-body">' + escHtml(d.texte) + '</span>' + (pt?'<span class="ri-point">#'+pt.num+'</span>':'') + '</li>';
  }).join('') : '<li class="placeholder">Aucune décision enregistrée.</li>';

  const acts = CHANGES.actions||[];
  const RESP = getResponsables();
  document.getElementById('action-recap').innerHTML = acts.length ? acts.map(a => {
    const pt = (DATA.odj||[]).find(p => p.id===a.point_id);
    return isEdit
      ? '<li class="recap-item"><select class="ri-edit-resp" onchange="editActResp(\'' + a.id + '\',this.value)">' + RESP.map(r => '<option' + (r===a.resp?' selected':'') + '>' + escHtml(r) + '</option>').join('') + '</select><input class="ri-edit" value="' + escHtml(a.description) + '" oninput="editAct(\'' + a.id + '\',this.value)">' + (pt?'<span class="ri-point">#'+pt.num+'</span>':'') + '<input class="ri-edit" style="width:90px" value="' + escHtml(a.echeance||'') + '" placeholder="AAAA-MM-JJ" oninput="editActEch(\'' + a.id + '\',this.value)"><button class="btn-recap-del" onclick="removeAct(\'' + a.id + '\')">&#128465;</button></li>'
      : '<li class="recap-item"><span class="npl-pill pill-remi">' + escHtml(a.resp) + '</span><span class="ri-body">' + escHtml(a.description) + '</span>' + (pt?'<span class="ri-point">#'+pt.num+'</span>':'') + '<span class="ri-ech">' + escHtml(a.echeance||'') + '</span></li>';
  }).join('') : '<li class="placeholder">Aucune action enregistrée.</li>';
}

// ── Mutations ──
window.changeNote    = function(nid,val){if(!CHANGES.notes)CHANGES.notes={};CHANGES.notes[nid]=val;saveChanges();renderOdj(URL_DATE||'',EDIT_MODE,PREPARE_MODE);};
window.editDec       = function(did,val){const d=(CHANGES.decisions||[]).find(d=>d.id===did);if(d){d.texte=val;renderRecap(EDIT_MODE);saveChanges();}};
window.removeDec     = function(did){CHANGES.decisions=(CHANGES.decisions||[]).filter(d=>d.id!==did);if(activeNoteId)renderNotePanel(activeNoteId,EDIT_MODE);renderRecap(EDIT_MODE);renderOdj(URL_DATE||'',EDIT_MODE,PREPARE_MODE);saveChanges();};
window.addDec        = function(nid){const inp=document.getElementById('inp-dec-'+nid);const txt=inp.value.trim();if(!txt){inp.focus();return;}if(!CHANGES.decisions)CHANGES.decisions=[];CHANGES.decisions.push({id:'d'+(_did++),point_id:nid,texte:txt});inp.value='';renderNotePanel(nid,true);renderRecap(true);renderOdj(URL_DATE||'',true,false);saveChanges();};
window.editAct       = function(aid,val){const a=(CHANGES.actions||[]).find(a=>a.id===aid);if(a){a.description=val;renderRecap(EDIT_MODE);saveChanges();}};
window.editActResp   = function(aid,val){const a=(CHANGES.actions||[]).find(a=>a.id===aid);if(a){a.resp=val;if(activeNoteId)renderNotePanel(activeNoteId,EDIT_MODE);renderRecap(EDIT_MODE);saveChanges();}};
window.editActEch    = function(aid,val){const a=(CHANGES.actions||[]).find(a=>a.id===aid);if(a){a.echeance=val||null;renderRecap(EDIT_MODE);saveChanges();}};
window.removeAct     = function(aid){CHANGES.actions=(CHANGES.actions||[]).filter(a=>a.id!==aid);if(activeNoteId)renderNotePanel(activeNoteId,EDIT_MODE);renderRecap(EDIT_MODE);renderOdj(URL_DATE||'',EDIT_MODE,PREPARE_MODE);saveChanges();};
window.addAct        = function(nid){const resp=document.getElementById('inp-act-resp-'+nid).value;const desc=document.getElementById('inp-act-desc-'+nid).value.trim();const ech=document.getElementById('inp-act-ech-'+nid).value.trim();if(!desc){document.getElementById('inp-act-desc-'+nid).focus();return;}if(!CHANGES.actions)CHANGES.actions=[];CHANGES.actions.push({id:'a'+(_aid++),point_id:nid,resp,description:desc,echeance:ech||null});document.getElementById('inp-act-desc-'+nid).value='';document.getElementById('inp-act-ech-'+nid).value='';renderNotePanel(nid,true);renderRecap(true);renderOdj(URL_DATE||'',true,false);saveChanges();};
window.changeStatut  = function(val){CHANGES.statut=val;saveChanges();};

// ── Clear ──
window.clearChanges = function() {
  if (!confirm('Effacer toutes les modifications en cours ?')) return;
  CHANGES = { statut: null, presences: [], notes: {}, decisions: [], actions: [] };
  if (serverAvailable && URL_DATE) {
    fetch(SERVER_URL + '/file?path=' + encodeURIComponent(changesPath(URL_DATE)), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    }).catch(()=>{});
  }
  activeNoteId = null;
  renderReunion(URL_DATE || '');
};

// ── Mode CR ──
function injectCRNotes() {
  document.querySelectorAll('#odj-tbody tr[data-nid]').forEach(tr => {
    const nid = tr.dataset.nid;
    if (!tr.querySelector('.cr-note-block')) {
      const note = (CHANGES.notes||{})[nid]||'';
      if (note.trim()) {
        const td = tr.querySelectorAll('td')[1];
        if (td) { const b=document.createElement('div'); b.className='cr-note-block'; b.textContent=note; td.appendChild(b); }
      }
    }
  });
}

function getEngagementsEmbedUrl(date) {
  for (const p of (DATA?DATA.odj||[]:[]))
    for (const r of (p.ressources||[]))
      if (r.url && r.url.includes('ressources/engagements'))
        return '../ressources/engagements/index.html?date=' + date + '&embed=true';
  return null;
}

function loadEngagementsEmbed(date) {
  const url = getEngagementsEmbedUrl(date);
  const container = document.getElementById('engagements-embed');
  const iframe    = document.getElementById('engagements-iframe');
  if (!url) { container.style.display='none'; return; }
  iframe.src = url; iframe.style.height='400px';
  function resize(){try{const h=iframe.contentDocument.body.scrollHeight;if(h>100)iframe.style.height=(h+20)+'px';}catch(e){iframe.style.height='800px';}}
  iframe.onload = function(){ resize(); setTimeout(resize,1200); };
}

window.refreshEmbed = function(){ const f=document.getElementById('engagements-iframe'); if(f.src)f.src=f.src; };

window.toggleCR = function() {
  crModeActive = !crModeActive;
  document.body.classList.toggle('mode-cr', crModeActive);
  const btn = document.getElementById('btn-mode-cr');
  btn.textContent = crModeActive ? 'Mode normal' : 'Mode CR';
  btn.classList.toggle('active', crModeActive);
  if (crModeActive) { injectCRNotes(); loadEngagementsEmbed(URL_DATE||''); }
};

// ── Persistance ──
async function saveChanges() { if (!EDIT_MODE||!serverAvailable||!URL_DATE) return; await saveJson(changesPath(URL_DATE), CHANGES); }
async function saveData()    { if (!PREPARE_MODE||!serverAvailable||!URL_DATE) return; await saveJson(dataPath(URL_DATE), DATA); }

// ── Démarrage ──
async function init() {
  await ping();

  // Sans ?date — rediriger vers la liste
  if (!URL_DATE) {
    window.location.replace('historique/index.html');
    return;
  }

  // Mode GitHub Pages
  if (!serverAvailable && REUNIONS_EMBEDDED) {
    await loadReunion(URL_DATE);
    return;
  }

  if (!serverAvailable) {
    showError('Serveur non disponible — démarrez start-server.bat');
    return;
  }

  await loadReunion(URL_DATE);
}

init();
</script>
</body>
</html>
