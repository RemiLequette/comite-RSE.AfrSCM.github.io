<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --border: #d8d4cc; --border-strong: #a09890;
    --text: #1a1815; --text-muted: #7a746c; --accent: #2d5a8e; --accent-light: #e8eff7;
    --green: #2e7d52; --green-bg: #eaf4ee;
    --orange: #b85c00; --orange-bg: #fdf0e0; --orange-border: #e8c090;
    --blue: #1a5296; --blue-bg: #e8f0fb;
    --red: #8b1a1a;
    --amber: #c87a1a; --amber-light: #fff8e6; --amber-border: #e6b84a;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: var(--sans); color: var(--text); padding: 28px; max-width: 860px; margin: 0 auto; }

  /* ── Indicateur serveur ── */
  #server-indicator { position: fixed; top: 12px; right: 18px; z-index: 60; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .65rem; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 3px 8px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  #server-indicator .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  #server-indicator.ok  .dot { background: var(--green); }
  #server-indicator.off .dot { background: var(--amber); }
  #server-indicator.err .dot { background: var(--red); }

  /* ── Breadcrumb ── */
  .breadcrumb { font-family: var(--mono); font-size: .7rem; color: var(--text-muted); margin-bottom: 16px; }
  .breadcrumb a { color: var(--accent); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb span { color: var(--text-muted); }

  /* ── Header ── */
  header { border-bottom: 2px solid var(--border-strong); padding-bottom: 14px; margin-bottom: 28px; }
  header h1 { font-family: var(--mono); font-size: 1.2rem; font-weight: 600; color: var(--accent); }
  header .sub { font-size: .78rem; color: var(--text-muted); margin-top: 4px; }

  /* ── Liste des réunions ── */
  .rev-list { list-style: none; }
  .rev-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
    cursor: pointer;
  }
  .rev-item:hover { border-left-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .rev-item.preparation { border-left-color: var(--blue); }
  .rev-item.en-cours    { border-left-color: var(--orange); }
  .rev-item.terminee    { border-left-color: var(--green); }

  .rev-date { font-family: var(--mono); font-size: .82rem; font-weight: 600; color: var(--accent); white-space: nowrap; min-width: 130px; }

  .rev-body { flex: 1; min-width: 0; }
  .rev-titre { font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rev-desc  { font-size: .72rem; color: var(--text-muted); }

  .badge { display: inline-block; font-family: var(--mono); font-size: .65rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
  .badge-preparation { background: var(--blue-bg);   color: var(--blue); }
  .badge-en-cours    { background: var(--orange-bg); color: var(--orange); }
  .badge-terminee    { background: var(--green-bg);  color: var(--green); }

  .rev-links { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .rev-link { display: inline-block; font-family: var(--mono); font-size: .68rem; font-weight: 600; padding: 3px 9px; border-radius: 2px; text-decoration: none; border: 1.5px solid var(--border); color: var(--text-muted); transition: all .15s; white-space: nowrap; }
  .rev-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .rev-link.link-cr      { border-color: var(--accent); color: var(--accent); }
  .rev-link.link-cr:hover { background: var(--accent); color: white; }
  .rev-link.link-edit    { border-color: var(--orange); color: var(--orange); }
  .rev-link.link-edit:hover { background: var(--orange); color: white; }
  .rev-link.link-prepare { border-color: var(--blue); color: var(--blue); }
  .rev-link.link-prepare:hover { background: var(--blue); color: white; }

  .empty-state  { text-align: center; padding: 3rem 2rem; color: var(--text-muted); font-size: .85rem; font-style: italic; }
  .loading-state { text-align: center; padding: 3rem 2rem; color: var(--text-muted); font-size: .85rem; font-style: italic; }

  footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: .68rem; color: var(--text-muted); }

const BASE = window.location.pathname.replace(/^\//, '').replace(/reunions\/historique\/[^/]*$/, '');
const HIST_DIR   = BASE + 'reunions/historique';

async function ping() { return false; }
async function saveChanges() {}

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function fmtDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Chargement ──
async function loadRevisions() {
  if (!serverAvailable) {
    if (REVISIONS_EMBEDDED) { render(REVISIONS_EMBEDDED); return; }
    document.getElementById('container').innerHTML =
      '<div class="empty-state">Serveur non disponible — démarrez start-server.bat</div>';
    return;
  }

  try {
    const r = await fetch(SERVER_URL + '/dir?path=' + encodeURIComponent(HIST_DIR));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { entries } = await r.json();
    if (!entries) throw new Error('Réponse invalide');

    const dates = (entries || [])
      .map(e => { const m = e.name.match(/^data-(\d{4}-\d{2}-\d{2})\.json$/); return m ? m[1] : null; })
      .filter(Boolean).sort().reverse();

    if (!dates.length) {
      document.getElementById('container').innerHTML = '<div class="empty-state">Aucune réunion enregistrée.</div>';
      document.getElementById('header-sub').textContent = 'Aucune réunion';
      return;
    }

    const changesDates = new Set(
      (entries || [])
        .map(e => { const m = e.name.match(/^changes-(\d{4}-\d{2}-\d{2})\.json$/); return m ? m[1] : null; })
        .filter(Boolean)
    );

    // Charger les data pour avoir titre et statut
    const revisions = await Promise.all(dates.map(async date => {
      try {
        const dataRes = await fetch(SERVER_URL + '/file?path=' + encodeURIComponent(HIST_DIR + '/data-' + date + '.json'));
        const data = dataRes.ok ? await dataRes.json() : null;
        let etat = 'preparation';
        if (changesDates.has(date)) {
          const changesRes = await fetch(SERVER_URL + '/file?path=' + encodeURIComponent(HIST_DIR + '/changes-' + date + '.json'));
          if (changesRes.ok) {
            const changes = await changesRes.json();
            etat = changes.statut === 'Terminée' ? 'terminee' : 'en-cours';
          }
        }
        return { date, data, etat };
      } catch(e) { return { date, data: null, etat: 'preparation' }; }
    }));

    render(revisions);
  } catch(e) {
    setIndicator('err', 'Erreur');
    document.getElementById('container').innerHTML =
      '<div class="empty-state">Erreur de chargement : ' + escHtml(e.message) + '</div>';
  }
}

function calcEtat(rev) {
  if (rev.etat) return rev.etat;  // chemin serveur : deja calcule
  if (!rev.changes) return 'preparation';
  const s = rev.changes.statut || '';
  if (s === 'Terminee' || s === 'Terminée') return 'terminee';
  if (s === 'En cours') return 'en-cours';
  return 'preparation';
}

function render(revisions) {
  if (!revisions.length) {
    document.getElementById('container').innerHTML = '<div class="empty-state">Aucune réunion enregistrée.</div>';
    document.getElementById('header-sub').textContent = 'Aucune réunion';
    return;
  }

  const items = revisions.map(rev => {
    const etat  = calcEtat(rev);
    const titre = rev.data ? (rev.data.titre || ('Réunion du ' + fmtDateShort(rev.date))) : ('Réunion du ' + fmtDateShort(rev.date));
    const lieu  = rev.data ? (rev.data.lieu || '') : '';
    const h     = rev.data ? (() => { const m = rev.data.start_min || 0; return Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0'); })() : '';
    const desc  = [h, lieu].filter(Boolean).join(' · ');

    let badge, badgeCls;
    if (etat === 'terminee')    { badge = 'Terminée';    badgeCls = 'badge-terminee'; }
    else if (etat === 'en-cours') { badge = 'En cours';    badgeCls = 'badge-en-cours'; }
    else                            { badge = 'Préparation'; badgeCls = 'badge-preparation'; }

    const fiche = navTo('../index.html?date=' + rev.date);
    const links = [];
    if (etat === 'terminee') {
      links.push('<a class="rev-link link-cr" href="' + escHtml(fiche) + '">CR</a>');
    } else if (etat === 'en-cours') {
      links.push('<a class="rev-link link-edit" href="' + escHtml(navTo('../index.html?date=' + rev.date + '&mode=edit')) + '">Éditer</a>');
      links.push('<a class="rev-link" href="' + escHtml(fiche) + '">Voir</a>');
    } else {
      links.push('<a class="rev-link link-prepare" href="' + escHtml(navTo('../index.html?date=' + rev.date + '&mode=prepare')) + '">Préparer</a>');
      links.push('<a class="rev-link" href="' + escHtml(fiche) + '">Voir</a>');
    }

    return '<li class="rev-item ' + etat + '" onclick="window.location.href=\'' + escHtml(fiche) + '\'">'
      + '<span class="rev-date">' + escHtml(fmtDateShort(rev.date)) + '</span>'
      + '<div class="rev-body">'
      + '<div class="rev-titre">' + escHtml(titre) + '</div>'
      + (desc ? '<div class="rev-desc">' + escHtml(desc) + '</div>' : '')
      + '</div>'
      + '<div class="rev-links">' + links.join('') + '</div>'
      + '<span class="badge ' + badgeCls + '">' + badge + '</span>'
      + '</li>';
  }).join('');

  document.getElementById('container').innerHTML = '<ul class="rev-list">' + items + '</ul>';

  const nb = revisions.length;
  const enCours   = revisions.filter(r => calcEtat(r) === 'en-cours').length;
  const terminees = revisions.filter(r => calcEtat(r) === 'terminee').length;
  document.getElementById('header-sub').textContent =
    nb + ' réunion' + (nb > 1 ? 's' : '')
    + (terminees ? ' · ' + terminees + ' terminée' + (terminees > 1 ? 's' : '') : '')
    + (enCours   ? ' · ' + enCours + ' en cours' : '');
  document.getElementById('footer-info').textContent =
    'AfrSCM · Comité RSE · ' + nb + ' réunion' + (nb > 1 ? 's' : '');
}

async function init() {
  await ping();
  if (!serverAvailable && REVISIONS_EMBEDDED) {
    render(REVISIONS_EMBEDDED);
    return;
  }
  await loadRevisions();
}

init();
</script>
</body>
</html>
